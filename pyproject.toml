[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tonight-repro"
version = "0.1.0"
description = "Answer 'can I reproduce this paper tonight?' before you download 200 GB."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "zhaoziian"}]
keywords = ["research", "reproducibility", "machine-learning", "gpu", "cli"]

[project.scripts]
tonight-repro = "tonight_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

